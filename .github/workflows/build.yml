name: Build (PyInstaller)

# 源码私有仓库用的版本：Release 发布到独立的公开仓库 RELEASE_REPO。
# 使用时把本文件改名为 build.yml（删掉另一个），并把 changelog.py 的 RELEASE_REPO 改成同一个值。
#
# 触发方式：
#   1) 在 Actions 页面手动点 "Run workflow"（workflow_dispatch）：只打包，产物在 Artifacts
#   2) 推送 v 开头的 tag（如 v0.1.0）：打包并发布 Release 到公开仓库 RELEASE_REPO
#
# 发布到另一个仓库依赖组织自己的 GitHub App（ccbs 用 ccbs-release-bot，其他组织按 <org>-release-bot 建一个）：
#   - App 安装在 ccbs-tools 组织，仅勾选 RELEASE_REPO，权限 Contents: Read and write
#   - 本仓库 Secrets：RELEASE_APP_ID（App ID）、RELEASE_APP_PRIVATE_KEY（.pem 全文）
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  RELEASE_REPO: ccbs-tools/stl-frame-editor-release
  RELEASE_BOT: ccbs-release-bot   # 初始化空仓库时的提交者名字，只是显示用

permissions:
  contents: read   # 本仓库只需读；写公开仓库用 App token

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      # 规则：changelog.py 的 RELEASE_REPO 含 "release" 字样 → 源码私有，Release 通过 App Secrets 发到
      # 独立公开仓库，所以它必须等于本工作流的 env.RELEASE_REPO（程序检查更新才会查对地方）。
      - name: Check release target
        shell: pwsh
        run: |
          $m = Select-String -Path stl_frame_editor/changelog.py -Pattern '^RELEASE_REPO\s*=\s*"([^"]+)"'
          if (-not $m) { Write-Error "RELEASE_REPO not found in stl_frame_editor/changelog.py"; exit 1 }
          $target = $m.Matches.Groups[1].Value
          Write-Host "changelog RELEASE_REPO=$target  workflow RELEASE_REPO=$env:RELEASE_REPO"
          if ($target -notmatch 'release') {
            Write-Error "RELEASE_REPO '$target' has no 'release' in its name: this workflow publishes to a separate public release repo and expects ccbs-tools/<name>-release. Use build.yml instead if the source repo is public (see dev-rules/CONVENTIONS.md §8)."
            exit 1
          }
          if ($target -ne $env:RELEASE_REPO) {
            Write-Error "RELEASE_REPO in changelog.py ('$target') must equal env.RELEASE_REPO in this workflow ('$env:RELEASE_REPO')."
            exit 1
          }

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $v = $env:GITHUB_REF -replace "refs/tags/v?", ""
          } else {
            $v = (Select-String -Path pyproject.toml -Pattern '^version\s*=\s*"(.+)"').Matches.Groups[1].Value
            $v = "$v+$($env:GITHUB_SHA.Substring(0,7))"
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "version = $v"

      - name: Check version consistency (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          $py = (Select-String -Path pyproject.toml -Pattern '^version\s*=\s*"(.+)"').Matches.Groups[1].Value
          $init = (Select-String -Path stl_frame_editor/__init__.py -Pattern '__version__\s*=\s*"(.+)"').Matches.Groups[1].Value
          Write-Host "tag=$env:VER pyproject=$py __init__=$init"
          if ($py -ne $env:VER -or $init -ne $env:VER) {
            Write-Error "version mismatch: tag=$env:VER pyproject=$py __init__=$init (see dev.md)"
            exit 1
          }

      - name: Build with PyInstaller
        run: uv run pyinstaller main.spec --noconfirm

      - name: Package zip
        id: pack
        shell: pwsh
        run: |
          $name = "stl-frame-editor-v${{ steps.ver.outputs.version }}-windows-x64.zip"
          Compress-Archive -Path dist/stl-frame-editor/* -DestinationPath $name -Force
          "zip=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "packed $name"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: stl-frame-editor-windows-x64
          path: ${{ steps.pack.outputs.zip }}
          if-no-files-found: error
          retention-days: 7

      # ---------- 以下仅在推 tag 时执行：发布到公开仓库 ----------

      - name: Release notes from changelog.py
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          PYTHONUTF8: "1"   # Windows runner 默认 cp1252，print 中文会崩
          VER: ${{ steps.ver.outputs.version }}
          ZIP: ${{ steps.pack.outputs.zip }}
        run: |
          @'
          import os
          from stl_frame_editor.changelog import RELEASES, release_notes

          ver, zip_name = os.environ["VER"], os.environ["ZIP"]
          entry = next((e for e in RELEASES if e["version"] == ver), None)
          lines = [f"## stl-frame-editor v{ver}", ""]
          if entry is None:
              lines.append(f"（changelog.py 中没有 {ver} 的条目，请补充 RELEASES）")
          else:
              lines.append(f"发布日期 / Date: {entry.get('date', '')}")
              lines += ["", "### 更新内容"] + [f"- {s}" for s in release_notes(entry, "zh")]
              lines += ["", "### Changes"] + [f"- {s}" for s in release_notes(entry, "en")]
          lines += ["", "### 下载 / Download", f"- Windows x64: `{zip_name}`（解压后运行 stl-frame-editor.exe）",
                    "- 校验: `SHA256SUMS.txt`"]
          with open("RELEASE_NOTES.md", "w", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          print(open("RELEASE_NOTES.md", encoding="utf-8").read())
          '@ | Set-Content -Path release_notes.py -Encoding UTF8
          uv run python release_notes.py

      - name: Mint GitHub App token for release repo
        if: startsWith(github.ref, 'refs/tags/')
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ccbs-tools
          repositories: stl-frame-editor-release

      - name: Ensure release repo is initialized
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          # 空仓库没有默认分支，创建 Release 时无法自动建 tag；先推一个 README 初始化
          if gh api "repos/${RELEASE_REPO}/commits?per_page=1" >/dev/null 2>&1; then
            echo "release repo already has commits"
            exit 0
          fi
          echo "release repo is empty, pushing initial README"
          tmp="$(mktemp -d)"
          cd "$tmp"
          git init -b main -q
          cat > README.md <<EOF
          # stl-frame-editor

          STL 坐标系修改器 的发布仓库。Windows 安装包见 [Releases](https://github.com/${RELEASE_REPO}/releases)。

          Release-only repository for stl-frame-editor. Windows builds are under [Releases](https://github.com/${RELEASE_REPO}/releases).
          EOF
          git -c user.name="${RELEASE_BOT}[bot]" \
              -c user.email="${RELEASE_BOT}[bot]@users.noreply.github.com" \
              add README.md
          git -c user.name="${RELEASE_BOT}[bot]" \
              -c user.email="${RELEASE_BOT}[bot]@users.noreply.github.com" \
              commit -q -m "Initial commit"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${RELEASE_REPO}.git" main

      - name: Publish Release to release repo
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ github.ref_name }}
          ZIP: ${{ steps.pack.outputs.zip }}
        run: |
          set -euo pipefail
          sha256sum "$ZIP" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release create "$TAG" "$ZIP" SHA256SUMS.txt \
            --repo "$RELEASE_REPO" \
            --title "stl-frame-editor $TAG" \
            --notes-file RELEASE_NOTES.md
          echo "https://github.com/${RELEASE_REPO}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"
