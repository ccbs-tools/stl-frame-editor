name: Build (PyInstaller)

# 触发方式：
#   1) 在 Actions 页面手动点 "Run workflow"（workflow_dispatch）
#   2) 推送 v 开头的 tag（如 v0.1.0）时，自动打包并发布 Release
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # 发布 Release 需要

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pyinstaller

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $v = $env:GITHUB_REF -replace "refs/tags/v?", ""
          } else {
            $v = (Select-String -Path pyproject.toml -Pattern '^version\s*=\s*"(.+)"').Matches.Groups[1].Value
            $v = "$v+$($env:GITHUB_SHA.Substring(0,7))"
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "version = $v"

      - name: Build with PyInstaller
        run: pyinstaller main.spec --noconfirm

      - name: Package zip
        id: pack
        shell: pwsh
        run: |
          $name = "stl-frame-editor-v${{ steps.ver.outputs.version }}-windows-x64.zip"
          Compress-Archive -Path dist/stl-frame-editor/* -DestinationPath $name -Force
          "zip=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "packed $name"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: stl-frame-editor-windows-x64
          path: ${{ steps.pack.outputs.zip }}
          if-no-files-found: error

      - name: Publish Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pack.outputs.zip }}
          generate_release_notes: true
